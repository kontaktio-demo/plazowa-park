      - generic [ref=f8e1059]:
        - generic [ref=f8e1060]:
          - button "Ile apartamentów liczy osiedle Plażowa Park?" [expanded] [ref=f8e1061]
          - paragraph [ref=f8e1068]: Osiedle to 20 apartamentów w 6 budynkach, o powierzchni od 82 do 133 m². Budynki narożne mieszczą po cztery apartamenty, a środkowe po dwa większe.
        - generic [ref=f8e1069]:
          - button "Jakie są ceny i czy są dostępne apartamenty?" [ref=f8e1070]
          - paragraph [ref=f8e1075]: Ceny zaczynają się od 633 000 zł. Bieżącą dostępność i cenę każdego apartamentu prezentujemy w sekcji Apartamenty; wiążące dane potwierdza biuro sprzedaży.
        - generic [ref=f8e1076]:
          - button "Czy poddasze jest wliczone w cenę?" [ref=f8e1077]
          - paragraph [ref=f8e1082]: Tak. Każdy apartament ma parter, piętro oraz poddasze. Poddasze jest zawarte w cenie nieruchomości i nie jest wliczone w metraż, więc możesz je zaadaptować według własnego pomysłu.
        - generic [ref=f8e1083]:
          - button "Co znajduje się w okolicy osiedla?" [ref=f8e1084]
          - paragraph [ref=f8e1089]: Osiedle leży bezpośrednio przy Zalewie Mrożyczka (30-hektarowym zbiorniku z plażą i kąpieliskiem) oraz w ponad 100-letnim lesie. W sąsiedztwie jest Central Wake Park i ścieżki rowerowe, a restauracje, szkoły i przychodnie są w krótkim dystansie.
        - generic [ref=f8e1090]:
          - button "Jaki jest standard wykończenia i technologia?" [ref=f8e1091]
          - paragraph [ref=f8e1096]: Apartamenty powstają w oparciu o pompy ciepła i ogrzewanie podłogowe, z opcją rekuperacji i fotowoltaiki. Standard obejmuje panoramiczne okna, elewację z tynku najwyższej klasy i elastycznej cegły oraz dach z blachy na rąbek stojący. Możliwa jest personalizacja wykończenia pod klucz.
        - generic [ref=f8e1097]:
          - button "Czy do apartamentu należy ogród i miejsce postojowe?" [ref=f8e1098]
          - paragraph [ref=f8e1103]: Tak. Każdy apartament ma prywatny ogród i taras z panoramicznymi oknami oraz dwa miejsca postojowe; cztery lokale dysponują własnym garażem.
        - generic [ref=f8e1104]:
