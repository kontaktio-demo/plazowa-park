        - paragraph [ref=f9e1070]: FAQ
        - heading "Najczęstsze pytania." [level=2] [ref=f9e1071]
        - paragraph [ref=f9e1072]: Nie znalazłeś odpowiedzi? Zadzwoń lub napisz - odpowiadamy zwykle w ciągu jednego dnia roboczego.
      - generic [ref=f9e1073]:
        - generic [ref=f9e1074]:
          - button "Ile apartamentów liczy osiedle Plażowa Park?" [expanded] [ref=f9e1075]
          - paragraph [ref=f9e1082]: Osiedle to 20 apartamentów w 6 budynkach, o powierzchni od 82 do 133 m². Budynki narożne mieszczą po cztery apartamenty, a środkowe po dwa większe.
        - generic [ref=f9e1083]:
          - button "Jakie są ceny i czy są dostępne apartamenty?" [ref=f9e1084]
          - paragraph [ref=f9e1089]: Ceny zaczynają się od 633 000 zł. Bieżącą dostępność i cenę każdego apartamentu prezentujemy w sekcji Apartamenty; wiążące dane potwierdza biuro sprzedaży.
        - generic [ref=f9e1090]:
          - button "Czy poddasze jest wliczone w cenę?" [ref=f9e1091]
          - paragraph [ref=f9e1096]: Tak. Każdy apartament ma parter, piętro oraz poddasze. Poddasze jest zawarte w cenie nieruchomości i nie jest wliczone w metraż, więc możesz je zaadaptować według własnego pomysłu.
        - generic [ref=f9e1097]:
          - button "Co znajduje się w okolicy osiedla?" [ref=f9e1098]
          - paragraph [ref=f9e1103]: Osiedle leży bezpośrednio przy Zalewie Mrożyczka (30-hektarowym zbiorniku z plażą i kąpieliskiem) oraz w ponad 100-letnim lesie. W sąsiedztwie jest Central Wake Park i ścieżki rowerowe, a restauracje, szkoły i przychodnie są w krótkim dystansie.
        - generic [ref=f9e1104]:
          - button "Jaki jest standard wykończenia i technologia?" [ref=f9e1105]
          - paragraph [ref=f9e1110]: Apartamenty powstają w oparciu o pompy ciepła i ogrzewanie podłogowe, z opcją rekuperacji i fotowoltaiki. Standard obejmuje panoramiczne okna, elewację z tynku najwyższej klasy i elastycznej cegły oraz dach z blachy na rąbek stojący. Możliwa jest personalizacja wykończenia pod klucz.
        - generic [ref=f9e1111]:
          - button "Czy do apartamentu należy ogród i miejsce postojowe?" [ref=f9e1112]
          - paragraph [ref=f9e1117]: Tak. Każdy apartament ma prywatny ogród i taras z panoramicznymi oknami oraz dwa miejsca postojowe; cztery lokale dysponują własnym garażem.
        - generic [ref=f9e1118]:
          - button "Kto jest deweloperem inwestycji?" [ref=f9e1119]
          - paragraph [ref=f9e1124]: Inwestorem i deweloperem jest KS Prestige Development Sp. z o.o. z siedzibą w Głownie (KRS 0001031916, NIP 7331366052).
